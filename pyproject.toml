[project]
name = "epl-predictor-2026"
version = "1.0.0"
description = "AI/ML-powered Premier League 2026/27 prediction system — Dixon-Coles + Monte Carlo engine, Flask dashboard, live-data pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Kimotho" }]

dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "requests",
    "apscheduler",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "statsmodels",
    "openpyxl",
    "reportlab",
    "soccerdata",
    "python-dotenv",
    "waitress",
]

[project.optional-dependencies]
nlp = ["transformers", "torch"]
scraping = ["ScraperFC"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
